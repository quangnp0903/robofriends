version: 2.1
jobs:
  build:
    docker:
      - image: circleci/node:latest
    steps:
      - checkout
      - run: npm install
      - run: CI=true npm run build
  test:
    docker:
      - image: circleci/node:latest
    steps:
      - checkout
      - run: npm install
      - run: npm run test-react
  hithere:
    docker:
      - image: circleci/node:latest
    steps:
      - checkout
      - run: echo "Helllooooo!"
workflows:
  version: 2
  build-test-and-lint:
    jobs:
      - build:
          filters:
            branches:
              ignore:
                - /legacy\/.*/ # skip legacy/* branches
      - hithere
      - test:
          filters:
            branches:
              ignore:
                - /legacy\/.*/ # skip legacy/* branches
          requires:
            - hithere
